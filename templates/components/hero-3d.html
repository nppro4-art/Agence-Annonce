<section class="hero hero--3d" id="hero">
  <!-- Canvas Three.js -->
  <canvas id="hero-3d-canvas" aria-hidden="true"></canvas>
  <div class="hero-grain" aria-hidden="true"></div>
  <div class="hero-vignette" aria-hidden="true"></div>

  <div class="container hero-inner">
    <div class="hero-content">
      <span class="eyebrow reveal">{{pages.home.hero.eyebrow}}</span>
      <h1 class="hero-title reveal reveal-delay-1">
        {{pages.home.hero.title}}<br>
        <em>{{pages.home.hero.title_em}}</em>
      </h1>
      <p class="hero-subtitle reveal reveal-delay-2">{{pages.home.hero.subtitle}}</p>
      <div class="hero-actions reveal reveal-delay-3">
        {{HERO_CTA_PRIMARY}}
        {{HERO_CTA_SECONDARY}}
      </div>
      <div class="hero-trust reveal reveal-delay-4">
        {{HERO_TRUST}}
      </div>
    </div>

    <!-- Objet 3D côté droit -->
    <div class="hero-3d-object reveal reveal-delay-2" id="hero-3d-object" aria-hidden="true">
      <!-- Cube CSS3D interactif (fallback si Three.js non dispo) -->
      <div class="scene-3d">
        <div class="cube-wrapper" id="hero-cube">
          <div class="cube-face cube-face--front">  <span class="cube-logo">{{site.name}}</span></div>
          <div class="cube-face cube-face--back">   <span class="cube-logo">{{site.name}}</span></div>
          <div class="cube-face cube-face--left">   <span class="cube-dot"></span></div>
          <div class="cube-face cube-face--right">  <span class="cube-dot"></span></div>
          <div class="cube-face cube-face--top">    <span class="cube-dot"></span></div>
          <div class="cube-face cube-face--bottom"> <span class="cube-dot"></span></div>
        </div>
      </div>
      <!-- Halo derrière le cube -->
      <div class="hero-3d-glow" aria-hidden="true"></div>
      <!-- Orbes orbitaux -->
      <div class="orbit-ring orbit-ring--1" aria-hidden="true"><div class="orbit-dot"></div></div>
      <div class="orbit-ring orbit-ring--2" aria-hidden="true"><div class="orbit-dot"></div></div>
    </div>
  </div>

  <div class="hero-scroll-indicator" aria-hidden="true"><span></span></div>
</section>

<style>
/* ══ HERO 3D ══════════════════════════════════════════ */
.hero--3d {
  position: relative;
  min-height: 100vh;
  display: flex; align-items: center;
  overflow: hidden;
  background: var(--color-bg);
}

#hero-3d-canvas {
  position: absolute; inset: 0;
  width: 100%; height: 100%;
  z-index: 0; pointer-events: none;
}
.hero-grain {
  position: absolute; inset: 0; z-index: 1; pointer-events: none;
  background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.04'/%3E%3C/svg%3E");
  opacity: .4;
}
.hero-vignette {
  position: absolute; inset: 0; z-index: 1; pointer-events: none;
  background: radial-gradient(ellipse 80% 70% at 30% 50%, transparent 0%, rgba(var(--color-bg-rgb), .7) 100%);
}
.hero--3d .hero-inner {
  position: relative; z-index: 2;
  padding-top: 160px; padding-bottom: 100px;
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 60px; align-items: center;
}
.hero--3d .hero-content { max-width: 560px; }

/* ══ SCÈNE 3D CSS ══════════════════════════════════════ */
.hero-3d-object {
  position: relative;
  display: flex; align-items: center; justify-content: center;
  height: 380px;
}
.scene-3d {
  perspective: 700px;
  width: 180px; height: 180px;
}
.cube-wrapper {
  width: 180px; height: 180px;
  transform-style: preserve-3d;
  animation: hero-cube-spin 14s linear infinite;
  position: relative;
}
@keyframes hero-cube-spin {
  0%   { transform: rotateX(12deg) rotateY(0deg); }
  100% { transform: rotateX(12deg) rotateY(360deg); }
}
.cube-face {
  position: absolute;
  width: 180px; height: 180px;
  border: 1px solid color-mix(in srgb, var(--color-accent) 30%, transparent);
  background: color-mix(in srgb, var(--color-accent) 4%, var(--color-bg));
  display: flex; align-items: center; justify-content: center;
  backdrop-filter: blur(4px);
}
.cube-face--front  { transform: translateZ(90px); }
.cube-face--back   { transform: rotateY(180deg) translateZ(90px); }
.cube-face--left   { transform: rotateY(-90deg) translateZ(90px); }
.cube-face--right  { transform: rotateY(90deg)  translateZ(90px); }
.cube-face--top    { transform: rotateX(90deg)  translateZ(90px); }
.cube-face--bottom { transform: rotateX(-90deg) translateZ(90px); }

.cube-logo {
  font-family: var(--font-heading, serif);
  font-size: .9rem; font-style: italic;
  color: color-mix(in srgb, var(--color-accent) 80%, transparent);
  letter-spacing: -.01em; pointer-events: none; user-select: none;
}
.cube-dot {
  width: 8px; height: 8px; border-radius: 50%;
  background: color-mix(in srgb, var(--color-accent) 35%, transparent);
}

/* Halo derrière */
.hero-3d-glow {
  position: absolute; inset: -40px;
  background: radial-gradient(ellipse 50% 50% at 50% 50%, color-mix(in srgb, var(--color-accent) 14%, transparent) 0%, transparent 70%);
  pointer-events: none; z-index: -1;
  animation: glow-pulse 4s ease-in-out infinite alternate;
}
@keyframes glow-pulse { from { opacity: .6; transform: scale(.95); } to { opacity: 1; transform: scale(1.05); } }

/* Anneaux orbitaux */
.orbit-ring {
  position: absolute;
  border-radius: 50%;
  border: 1px solid color-mix(in srgb, var(--color-accent) 18%, transparent);
  pointer-events: none;
}
.orbit-ring--1 {
  width: 280px; height: 280px;
  top: 50%; left: 50%; transform: translate(-50%,-50%) rotateX(70deg);
  animation: orbit-spin 8s linear infinite;
}
.orbit-ring--2 {
  width: 380px; height: 380px;
  top: 50%; left: 50%; transform: translate(-50%,-50%) rotateX(70deg) rotateZ(40deg);
  animation: orbit-spin 14s linear infinite reverse;
}
@keyframes orbit-spin { to { transform: translate(-50%,-50%) rotateX(70deg) rotateZ(360deg); } }
.orbit-dot {
  position: absolute; top: -4px; left: 50%; transform: translateX(-50%);
  width: 7px; height: 7px; border-radius: 50%;
  background: var(--color-accent);
  box-shadow: 0 0 10px var(--color-accent);
}
.orbit-ring--2 .orbit-dot {
  width: 5px; height: 5px;
  box-shadow: 0 0 8px var(--color-accent);
}

/* Trust + scroll */
.hero-trust {
  display: flex; align-items: center; gap: 18px;
  margin-top: 38px; flex-wrap: wrap;
}
.hero-trust-item {
  display: flex; align-items: center; gap: 7px;
  font-size: .75rem; font-weight: 600;
  color: color-mix(in srgb, var(--color-text) 50%, transparent);
}
.hero-trust-item svg { width: 14px; height: 14px; color: var(--color-accent); flex-shrink: 0; }

.hero-scroll-indicator {
  position: absolute; bottom: 32px; left: 50%;
  transform: translateX(-50%); z-index: 3;
}
.hero-scroll-indicator span {
  display: block; width: 1px; height: 48px;
  background: linear-gradient(to bottom, var(--color-accent), transparent);
  animation: scroll-line 2.2s ease-in-out infinite;
}
@keyframes scroll-line {
  0%   { transform: scaleY(0); transform-origin: top; opacity: 1; }
  50%  { transform: scaleY(1); transform-origin: top; }
  51%  { transform-origin: bottom; }
  100% { transform: scaleY(0); transform-origin: bottom; opacity: 0; }
}

@media (max-width: 900px) {
  .hero--3d .hero-inner { grid-template-columns: 1fr; padding-top: 120px; }
  .hero-3d-object { display: none; }
}
@media (max-width: 640px) {
  .hero-scroll-indicator { display: none; }
}
</style>

<script>
/* ══ Cube CSS3D — interaction souris ══ */
(function() {
  var cube  = document.getElementById('hero-cube');
  var scene = cube ? cube.closest('.scene-3d') : null;
  var obj   = document.getElementById('hero-3d-object');
  if (!cube || !obj) return;

  var targetRX = 12, targetRY = 0, currRX = 12, currRY = 0;
  var running = false;

  obj.addEventListener('mousemove', function(e) {
    var rect = obj.getBoundingClientRect();
    var cx = (e.clientX - rect.left) / rect.width  - .5;
    var cy = (e.clientY - rect.top)  / rect.height - .5;
    targetRX = 12 - cy * 28;
    targetRY = cx * 50;
  });
  obj.addEventListener('mouseleave', function() { targetRX = 12; targetRY = 0; });

  function loop() {
    currRX += (targetRX - currRX) * .07;
    currRY += (targetRY - currRY) * .07;
    cube.style.animation = 'none';
    cube.style.transform = 'rotateX(' + currRX + 'deg) rotateY(' + currRY + 'deg)';
    requestAnimationFrame(loop);
  }
  loop();
})();

/* ══ Three.js — particules + grille ══ */
(function() {
  var canvas = document.getElementById('hero-3d-canvas');
  if (!canvas || !window.THREE) return;

  var W = window.innerWidth, H = window.innerHeight;
  var renderer = new THREE.WebGLRenderer({ canvas: canvas, alpha: true, antialias: true });
  renderer.setSize(W, H);
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  renderer.setClearColor(0x000000, 0);

  var scene  = new THREE.Scene();
  var camera = new THREE.PerspectiveCamera(55, W / H, .1, 1000);
  camera.position.z = 5;

  /* Particules */
  var N = 90;
  var pos = new Float32Array(N * 3);
  for (var i = 0; i < N; i++) {
    pos[i*3]   = (Math.random() - .5) * 14;
    pos[i*3+1] = (Math.random() - .5) * 9;
    pos[i*3+2] = (Math.random() - .5) * 7 - 2;
  }
  var geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  var mat = new THREE.PointsMaterial({ color: 0xD6B36A, size: 0.022, transparent: true, opacity: .45 });
  var pts = new THREE.Points(geo, mat);
  scene.add(pts);

  /* Anneau discret */
  var ringGeo = new THREE.TorusGeometry(3.5, .003, 6, 100);
  var ringMat = new THREE.MeshBasicMaterial({ color: 0xD6B36A, transparent: true, opacity: .08 });
  var ring = new THREE.Mesh(ringGeo, ringMat);
  ring.rotation.x = Math.PI / 4;
  ring.position.x = 2;
  scene.add(ring);

  var mouseX = 0, mouseY = 0;
  window.addEventListener('mousemove', function(e) {
    mouseX = (e.clientX / W - .5) * 2;
    mouseY = (e.clientY / H - .5) * 2;
  }, { passive: true });

  window.addEventListener('resize', function() {
    W = window.innerWidth; H = window.innerHeight;
    camera.aspect = W / H;
    camera.updateProjectionMatrix();
    renderer.setSize(W, H);
  });

  var t = 0;
  function animate() {
    requestAnimationFrame(animate);
    t += .004;
    pts.rotation.y = t * .025;
    pts.rotation.x = t * .012;
    ring.rotation.z = t * .06;
    camera.position.x += (mouseX * .3 - camera.position.x) * .04;
    camera.position.y += (-mouseY * .2 - camera.position.y) * .04;
    camera.lookAt(scene.position);
    renderer.render(scene, camera);
  }
  animate();
})();
</script>
