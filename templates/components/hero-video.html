<section class="hero hero--video" id="hero">
  <!-- Vidéo fond (Unsplash/Pexels video ou placeholder animé) -->
  <div class="hero-video-wrap">
    {{HERO_VIDEO_ELEMENT}}
    <div class="hero-video-poster" id="hero-video-poster" style="background-image: url('{{HERO_IMAGE_URL}}')"></div>
  </div>

  <!-- Overlay de couleur adapté au thème -->
  <div class="hero-video-overlay"></div>

  <!-- Grain premium -->
  <div class="hero-grain" aria-hidden="true"></div>

  <div class="container hero-inner">
    <div class="hero-content">
      <span class="eyebrow reveal">{{pages.home.hero.eyebrow}}</span>
      <h1 class="hero-title reveal reveal-delay-1">
        {{pages.home.hero.title}}<br>
        <em>{{pages.home.hero.title_em}}</em>
      </h1>
      <p class="hero-subtitle reveal reveal-delay-2">{{pages.home.hero.subtitle}}</p>
      <div class="hero-actions reveal reveal-delay-3">
        {{HERO_CTA_PRIMARY}}
        {{HERO_CTA_SECONDARY}}
      </div>
      <div class="hero-trust reveal reveal-delay-4">
        {{HERO_TRUST}}
      </div>
    </div>
  </div>

  <!-- Indicateur scroll -->
  <div class="hero-scroll-indicator" aria-hidden="true">
    <span></span>
  </div>
</section>

<style>
/* ══ HERO VIDÉO ══════════════════════════════════════ */
.hero--video {
  position: relative;
  min-height: 100vh;
  display: flex; align-items: center;
  overflow: hidden;
}
.hero-video-wrap {
  position: absolute; inset: 0; z-index: 0;
}
.hero-video-wrap video {
  width: 100%; height: 100%;
  object-fit: cover; object-position: center;
  display: block;
}
.hero-video-poster {
  position: absolute; inset: 0;
  background-size: cover; background-position: center;
  z-index: 1;
  transition: opacity .8s;
}
.hero-video-poster.hidden { opacity: 0; pointer-events: none; }
.hero-video-overlay {
  position: absolute; inset: 0; z-index: 2;
  background: linear-gradient(
    to bottom,
    rgba(var(--color-bg-rgb), .72) 0%,
    rgba(var(--color-bg-rgb), .55) 50%,
    rgba(var(--color-bg-rgb), .82) 100%
  );
}
.hero-grain {
  position: absolute; inset: 0; z-index: 3; pointer-events: none;
  background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.04'/%3E%3C/svg%3E");
  opacity: .45;
}
.hero--video .hero-inner {
  position: relative; z-index: 4;
  padding-top: 160px; padding-bottom: 100px;
}
.hero--video .hero-content { max-width: 680px; }

/* Trust indicators */
.hero-trust {
  display: flex; align-items: center; gap: 20px;
  margin-top: 40px; flex-wrap: wrap;
}
.hero-trust-item {
  display: flex; align-items: center; gap: 8px;
  font-size: .76rem; font-weight: 600;
  color: color-mix(in srgb, var(--color-text) 55%, transparent);
  letter-spacing: .03em;
}
.hero-trust-item svg {
  width: 14px; height: 14px; color: var(--color-accent); flex-shrink: 0;
}

/* Scroll indicator */
.hero-scroll-indicator {
  position: absolute; bottom: 32px; left: 50%;
  transform: translateX(-50%);
  z-index: 4; display: flex; flex-direction: column; align-items: center;
}
.hero-scroll-indicator span {
  display: block; width: 1px; height: 48px;
  background: linear-gradient(to bottom, var(--color-accent), transparent);
  animation: scroll-line 2.2s ease-in-out infinite;
}
@keyframes scroll-line {
  0%   { transform: scaleY(0); transform-origin: top; opacity: 1; }
  50%  { transform: scaleY(1); transform-origin: top; opacity: 1; }
  51%  { transform: scaleY(1); transform-origin: bottom; }
  100% { transform: scaleY(0); transform-origin: bottom; opacity: 0; }
}

@media (max-width: 640px) {
  .hero--video .hero-inner { padding-top: 120px; padding-bottom: 80px; }
  .hero-scroll-indicator { display: none; }
  .hero-trust { gap: 12px; }
}
</style>

<script>
/* Masquer le poster quand la vidéo est prête */
(function() {
  var v = document.querySelector('.hero--video video');
  var p = document.getElementById('hero-video-poster');
  if (!v || !p) return;
  v.addEventListener('canplaythrough', function() {
    p.classList.add('hidden');
  });
  v.play().catch(function() {});
})();
</script>
