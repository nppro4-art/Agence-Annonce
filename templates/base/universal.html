<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title><!-- CREAZIO:TITLE --></title>
<!-- CREAZIO:SEO -->
<!-- CREAZIO:THEME -->
<style>
/* ════════════════════════════════════════════════════════════
   CRÉAZIO — Template universel premium
   Conçu pour : clarté en 5 secondes, responsive total,
   animations légères au défilement, identité pilotée par
   les variables --color-* et --font-* (voir CREAZIO:THEME)
   ════════════════════════════════════════════════════════════ */

*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
@media (prefers-reduced-motion: reduce){
  html{scroll-behavior:auto}
  *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important;scroll-behavior:auto!important}
}

body{
  font-family:var(--font-body);
  font-size:16px;line-height:1.65;
  color:var(--color-text);
  background:var(--color-bg);
  -webkit-font-smoothing:antialiased;
  overflow-x:hidden;
}

img{max-width:100%;display:block;height:auto}
a{color:inherit;text-decoration:none}
button{font-family:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--color-accent);outline-offset:3px}

.container{max-width:1180px;margin:0 auto;padding:0 24px}
@media (max-width:640px){.container{padding:0 20px}}

/* ── Reveal au scroll ─────────────────────────────────────── */
.reveal{opacity:0;transform:translateY(28px);transition:opacity .8s cubic-bezier(.16,1,.3,1),transform .8s cubic-bezier(.16,1,.3,1)}
.reveal.in{opacity:1;transform:translateY(0)}
.reveal-delay-1{transition-delay:.1s}
.reveal-delay-2{transition-delay:.2s}
.reveal-delay-3{transition-delay:.3s}

/* ── Typographie ──────────────────────────────────────────── */
h1,h2,h3,h4{font-family:var(--font-heading);font-weight:400;letter-spacing:-.01em;line-height:1.08;color:var(--color-text)}
.eyebrow{
  font-family:var(--font-body);font-size:.72rem;font-weight:700;
  letter-spacing:.18em;text-transform:uppercase;color:var(--color-accent);
  margin-bottom:14px;display:block;
}
.section-title{font-size:clamp(2rem,4.5vw,3.2rem);margin-bottom:14px}
.section-subtitle{font-size:1rem;color:var(--color-text-muted);max-width:560px;line-height:1.75}
.section-head{margin-bottom:48px}
.section-head.center{text-align:center;margin-left:auto;margin-right:auto}
.section-head.center .section-subtitle{margin-left:auto;margin-right:auto}

section{padding:90px 0}
@media (max-width:780px){section{padding:64px 0}}

/* ── Boutons ──────────────────────────────────────────────── */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:8px;
  font-size:.88rem;font-weight:700;letter-spacing:.01em;
  padding:15px 30px;border-radius:100px;border:1.5px solid transparent;
  transition:transform .25s cubic-bezier(.34,1.56,.64,1),box-shadow .25s,background .2s,color .2s,border-color .2s;
  white-space:nowrap;
}
.btn-primary{background:var(--color-text);color:var(--color-bg)}
.btn-primary:hover{transform:translateY(-2px);box-shadow:0 10px 30px -8px rgba(0,0,0,.35)}
.btn-outline{background:transparent;color:var(--color-text);border-color:var(--color-border)}
.btn-outline:hover{border-color:var(--color-text);transform:translateY(-2px)}
.btn-accent{background:var(--color-accent);color:var(--color-bg)}
.btn-accent:hover{transform:translateY(-2px);box-shadow:0 10px 30px -8px var(--color-accent)}

/* ── Navigation ───────────────────────────────────────────── */
.nav{
  position:fixed;top:0;left:0;right:0;z-index:1000;
  background:color-mix(in srgb, var(--color-bg) 88%, transparent);
  backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);
  border-bottom:1px solid transparent;
  transition:border-color .3s, background .3s;
}
.nav.scrolled{border-bottom-color:var(--color-border)}
.nav-inner{
  display:flex;align-items:center;justify-content:space-between;
  height:76px;
}
.nav-logo{font-family:var(--font-heading);font-size:1.35rem;color:var(--color-text);letter-spacing:-.01em}
.nav-logo em{font-style:italic;color:var(--color-accent)}
.nav-logo img{height:34px;width:auto;display:block}
.nav-links{display:flex;align-items:center;gap:36px;list-style:none}
.nav-links a{
  font-size:.86rem;font-weight:600;color:var(--color-text-muted);
  transition:color .2s;position:relative;
}
.nav-links a:hover{color:var(--color-text)}
.nav-cta{margin-left:8px}
.nav-toggle{
  display:none;background:none;border:none;width:40px;height:40px;
  position:relative;flex-shrink:0;
}
.nav-toggle span{
  position:absolute;left:8px;right:8px;height:2px;background:var(--color-text);
  border-radius:2px;transition:all .3s cubic-bezier(.4,0,.2,1);
}
.nav-toggle span:nth-child(1){top:15px}
.nav-toggle span:nth-child(2){top:23px}
.nav-toggle span:nth-child(3){top:31px}
.nav-toggle.open span:nth-child(1){transform:translateY(8px) rotate(45deg)}
.nav-toggle.open span:nth-child(2){opacity:0}
.nav-toggle.open span:nth-child(3){transform:translateY(-8px) rotate(-45deg)}

@media (max-width:880px){
  .nav-links{
    position:fixed;top:76px;left:0;right:0;bottom:0;
    flex-direction:column;justify-content:flex-start;align-items:stretch;
    background:var(--color-bg);padding:32px 24px;gap:4px;
    border-top:1px solid var(--color-border);
    transform:translateX(100%);transition:transform .35s cubic-bezier(.4,0,.2,1);
    overflow-y:auto;
  }
  .nav-links.open{transform:translateX(0)}
  .nav-links a{padding:16px 4px;border-bottom:1px solid var(--color-border);font-size:1rem}
  .nav-links .nav-cta{margin-left:0;margin-top:16px;width:100%}
  .nav-links .nav-cta .btn{width:100%}
  .nav-toggle{display:block}
}

/* ── Hero ─────────────────────────────────────────────────── */
.hero{
  position:relative;padding:0;min-height:92vh;
  display:flex;align-items:center;
  background:var(--color-bg);overflow:hidden;
}
.hero-bg{
  position:absolute;inset:0;z-index:0;
}
.hero-bg img{width:100%;height:100%;object-fit:cover;will-change:transform}
.hero-bg::after{
  content:'';position:absolute;inset:0;
  background:linear-gradient(180deg, color-mix(in srgb, var(--color-bg) 35%, transparent) 0%, var(--color-bg) 100%);
}
.hero-bg.has-image::after{
  background:linear-gradient(180deg, color-mix(in srgb, var(--color-primary) 55%, transparent) 0%, var(--color-bg) 92%);
}
.hero-glow{
  position:absolute;top:-20%;right:-10%;width:60%;height:70%;
  background:radial-gradient(circle, color-mix(in srgb, var(--color-accent) 28%, transparent) 0%, transparent 70%);
  filter:blur(60px);z-index:0;pointer-events:none;
  animation:glow-drift 18s ease-in-out infinite alternate;
}
@keyframes glow-drift{
  0%{transform:translate(0,0) scale(1)}
  100%{transform:translate(-6%,8%) scale(1.15)}
}
.hero-inner{position:relative;z-index:1;padding-top:140px;padding-bottom:90px;width:100%}
.hero-content{max-width:760px}
.hero-title{
  font-size:clamp(2.6rem,7vw,5.2rem);
  margin-bottom:22px;
}
.hero-title em{
  font-style:italic;color:var(--color-accent);
}
.hero-subtitle{
  font-size:clamp(1rem,1.6vw,1.2rem);
  color:var(--color-text-muted);
  max-width:540px;margin-bottom:38px;
  line-height:1.75;
}
.hero-actions{display:flex;gap:14px;flex-wrap:wrap}
@media (max-width:640px){
  .hero{min-height:88vh}
  .hero-inner{padding-top:110px;padding-bottom:60px}
  .hero-actions .btn{width:100%}
  .hero-actions{flex-direction:column}
}

/* ── Services / grille ───────────────────────────────────── */
.services{background:var(--color-surface)}
.services-grid{
  display:grid;grid-template-columns:repeat(3,1fr);gap:20px;
}
@media (max-width:900px){.services-grid{grid-template-columns:repeat(2,1fr)}}
@media (max-width:620px){.services-grid{grid-template-columns:1fr}}
.service-card{
  background:var(--color-bg);border:1px solid var(--color-border);
  border-radius:18px;padding:32px 28px;
  transition:transform .35s cubic-bezier(.34,1.1,.64,1),box-shadow .35s,border-color .35s;
}
.service-card:hover{
  transform:translateY(-6px);
  box-shadow:0 20px 50px -20px rgba(0,0,0,.25);
  border-color:var(--color-accent);
}
.service-icon{font-size:2rem;margin-bottom:18px;display:inline-block}
.service-card h3{font-size:1.25rem;margin-bottom:10px}
.service-card p{color:var(--color-text-muted);font-size:.92rem;margin-bottom:14px}
.service-price{
  font-family:var(--font-heading);font-size:1.4rem;color:var(--color-accent);
}

/* ── About ────────────────────────────────────────────────── */
.about-grid{
  display:grid;grid-template-columns:1fr 1fr;gap:64px;align-items:center;
}
@media (max-width:880px){.about-grid{grid-template-columns:1fr;gap:36px}}
.about-media{
  position:relative;border-radius:20px;overflow:hidden;
  aspect-ratio:4/5;background:var(--color-surface);
  border:1px solid var(--color-border);
}
.about-media img{width:100%;height:100%;object-fit:cover}
.about-media::before{
  content:'';position:absolute;inset:0;z-index:1;pointer-events:none;
  border-radius:20px;border:1px solid color-mix(in srgb, var(--color-accent) 30%, transparent);
  margin:14px;
}
.about-text p{color:var(--color-text-muted);margin-bottom:28px;font-size:1.02rem;line-height:1.85}
.about-stats{display:flex;gap:36px;flex-wrap:wrap}
.about-stat-val{font-family:var(--font-heading);font-size:2.4rem;color:var(--color-accent);line-height:1}
.about-stat-label{font-size:.78rem;color:var(--color-text-muted);margin-top:6px;letter-spacing:.04em}

/* ── Galerie ──────────────────────────────────────────────── */
.gallery{background:var(--color-surface)}
.gallery-grid{
  display:grid;grid-template-columns:repeat(3,1fr);gap:14px;
}
.gallery-item{
  position:relative;border-radius:16px;overflow:hidden;
  aspect-ratio:1/1;background:var(--color-bg);
  border:1px solid var(--color-border);
  transition:transform .5s cubic-bezier(.16,1,.3,1);
}
.gallery-item:nth-child(3n+1){aspect-ratio:1/1.25}
.gallery-item img{
  width:100%;height:100%;object-fit:cover;
  transition:transform .7s cubic-bezier(.16,1,.3,1);
}
.gallery-item:hover{transform:translateY(-4px) rotate(-0.4deg)}
.gallery-item:hover img{transform:scale(1.08)}
@media (max-width:880px){.gallery-grid{grid-template-columns:repeat(2,1fr)}}
@media (max-width:520px){.gallery-grid{grid-template-columns:1fr}.gallery-item{aspect-ratio:4/3!important}}

/* ── Attribution photo (Unsplash) ─────────────────────────── */
.img-credit{
  position:absolute;bottom:8px;right:8px;z-index:2;
  font-size:.62rem;font-weight:500;color:#fff;
  background:rgba(0,0,0,.45);backdrop-filter:blur(4px);
  padding:3px 8px;border-radius:100px;letter-spacing:.01em;
  pointer-events:none;
}

/* ── Processus / étapes ───────────────────────────────────── */
.process{background:var(--color-bg)}
.process-steps{
  display:grid;grid-template-columns:repeat(3,1fr);gap:32px;
  position:relative;
}
@media (max-width:880px){.process-steps{grid-template-columns:1fr;gap:36px}}
.process-step{position:relative;padding-left:0}
.process-step-num{
  font-family:var(--font-heading);font-size:3rem;line-height:1;
  color:var(--color-accent);opacity:.35;margin-bottom:14px;
}
.process-step-title{font-size:1.15rem;margin-bottom:8px}
.process-step-text{color:var(--color-text-muted);font-size:.9rem;line-height:1.75}
.process-steps .process-step:not(:last-child)::after{
  content:'';display:none;
}
@media (min-width:881px){
  .process-steps .process-step:not(:last-child)::after{
    display:block;content:'';position:absolute;top:1.6rem;left:calc(100% + 16px);
    width:calc(100% - 32px);height:1px;
    background:linear-gradient(90deg, var(--color-border), transparent);
  }
}

/* ── Avant / Après ────────────────────────────────────────── */
.before-after{background:var(--color-surface)}
.ba-grid{display:grid;grid-template-columns:1fr 1fr;gap:20px}
@media (max-width:680px){.ba-grid{grid-template-columns:1fr}}
.ba-panel{position:relative;border-radius:16px;overflow:hidden;aspect-ratio:4/3;border:1px solid var(--color-border)}
.ba-panel img{width:100%;height:100%;object-fit:cover;filter:grayscale(0)}
.ba-label{
  position:absolute;top:14px;left:14px;z-index:2;
  font-size:.68rem;font-weight:800;letter-spacing:.12em;text-transform:uppercase;
  padding:5px 12px;border-radius:100px;backdrop-filter:blur(6px);
}
.ba-label-before{background:rgba(0,0,0,.5);color:#fff}
.ba-label-after{background:var(--color-accent);color:var(--color-bg)}

/* ── FAQ (accordéon) ──────────────────────────────────────── */
.faq{background:var(--color-bg)}
.faq-list{max-width:720px;margin:0 auto;display:flex;flex-direction:column;gap:10px}
.faq-item{
  background:var(--color-surface);border:1px solid var(--color-border);
  border-radius:14px;padding:0;overflow:hidden;
}
.faq-question{
  display:flex;align-items:center;justify-content:space-between;gap:16px;
  padding:18px 22px;cursor:pointer;font-weight:600;font-size:.95rem;
  list-style:none;transition:color .2s;
}
.faq-question::-webkit-details-marker{display:none}
.faq-icon{flex-shrink:0;transition:transform .3s cubic-bezier(.4,0,.2,1);color:var(--color-text-muted)}
.faq-item[open] .faq-icon{transform:rotate(180deg);color:var(--color-accent)}
.faq-answer{
  padding:0 22px 20px;color:var(--color-text-muted);font-size:.9rem;line-height:1.75;
  animation:faq-open .35s cubic-bezier(.16,1,.3,1);
}
@keyframes faq-open{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:translateY(0)}}

/* ── Bandeau CTA pleine largeur ──────────────────────────── */
.cta-banner{
  background:var(--color-primary);position:relative;overflow:hidden;
}
.cta-banner::before{
  content:'';position:absolute;top:-50%;right:-10%;width:50%;height:200%;
  background:radial-gradient(circle, color-mix(in srgb, var(--color-accent) 22%, transparent) 0%, transparent 70%);
  filter:blur(50px);pointer-events:none;
}
.cta-banner-inner{
  position:relative;z-index:1;text-align:center;
  display:flex;flex-direction:column;align-items:center;gap:18px;
}
.cta-banner-title{
  font-size:clamp(1.8rem,4vw,2.8rem);color:var(--color-bg);max-width:680px;
}
.cta-banner-subtitle{
  color:color-mix(in srgb, var(--color-bg) 65%, transparent);
  font-size:1rem;max-width:520px;line-height:1.7;
}

/* ── Témoignages ──────────────────────────────────────────── */
.testimonials-grid{
  display:grid;grid-template-columns:repeat(3,1fr);gap:20px;
}
@media (max-width:900px){.testimonials-grid{grid-template-columns:1fr}}
.testimonial-card{
  background:var(--color-bg);border:1px solid var(--color-border);
  border-radius:18px;padding:30px 28px;
}
.testimonial-stars{color:var(--color-accent);font-size:.9rem;margin-bottom:16px;letter-spacing:.1em}
.testimonial-text{font-size:.95rem;color:var(--color-text);margin-bottom:22px;line-height:1.8;font-style:italic}
.testimonial-author{font-weight:700;font-size:.88rem}
.testimonial-role{font-size:.76rem;color:var(--color-text-muted);margin-top:2px}

/* ── Contact ──────────────────────────────────────────────── */
.contact{background:var(--color-surface)}
.contact-grid{
  display:grid;grid-template-columns:1fr 1fr;gap:60px;
}
@media (max-width:880px){.contact-grid{grid-template-columns:1fr;gap:40px}}
.contact-info-item{
  display:flex;gap:16px;align-items:flex-start;
  padding:18px 0;border-bottom:1px solid var(--color-border);
}
.contact-info-item:last-child{border-bottom:none}
.contact-info-icon{
  width:40px;height:40px;border-radius:12px;flex-shrink:0;
  background:color-mix(in srgb, var(--color-accent) 12%, transparent);
  display:flex;align-items:center;justify-content:center;font-size:1.05rem;
}
.contact-info-label{font-size:.7rem;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--color-text-muted);margin-bottom:4px}
.contact-info-value{font-size:.96rem;font-weight:600}
.contact-hours{display:flex;flex-direction:column;gap:4px}
.contact-hours-row{display:flex;justify-content:space-between;font-size:.88rem;color:var(--color-text-muted)}

.contact-form{display:flex;flex-direction:column;gap:14px}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media (max-width:520px){.form-row{grid-template-columns:1fr}}
.form-field label{
  display:block;font-size:.7rem;font-weight:700;letter-spacing:.08em;
  text-transform:uppercase;color:var(--color-text-muted);margin-bottom:8px;
}
.form-field input,.form-field textarea{
  width:100%;background:var(--color-bg);border:1px solid var(--color-border);
  border-radius:12px;padding:13px 16px;font-family:var(--font-body);
  font-size:.92rem;color:var(--color-text);transition:border-color .2s;
  resize:vertical;
}
.form-field input:focus,.form-field textarea:focus{
  border-color:var(--color-accent);outline:none;
}
.contact-form .btn{margin-top:6px;align-self:flex-start}
@media (max-width:520px){.contact-form .btn{width:100%}}

/* ── Footer ───────────────────────────────────────────────── */
.site-footer{
  background:var(--color-primary);color:var(--color-bg);
  padding:60px 0 30px;
}
.footer-top{
  display:flex;justify-content:space-between;align-items:flex-start;
  gap:40px;flex-wrap:wrap;margin-bottom:40px;
  padding-bottom:40px;border-bottom:1px solid color-mix(in srgb, var(--color-bg) 14%, transparent);
}
.footer-brand{font-family:var(--font-heading);font-size:1.5rem}
.footer-tagline{color:color-mix(in srgb, var(--color-bg) 60%, transparent);font-size:.88rem;margin-top:10px;max-width:320px}
.footer-links{display:flex;gap:28px;flex-wrap:wrap}
.footer-links a{font-size:.84rem;color:color-mix(in srgb, var(--color-bg) 75%, transparent);transition:color .2s}
.footer-links a:hover{color:var(--color-bg)}
.footer-social{display:flex;gap:14px;margin-top:18px}
.footer-social a{
  width:38px;height:38px;border-radius:50%;
  border:1px solid color-mix(in srgb, var(--color-bg) 18%, transparent);
  display:flex;align-items:center;justify-content:center;font-size:1rem;
  transition:border-color .2s, background .2s;
}
.footer-social a:hover{background:color-mix(in srgb, var(--color-bg) 10%, transparent);border-color:var(--color-accent)}
.footer-bottom{
  display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:12px;
  font-size:.76rem;color:color-mix(in srgb, var(--color-bg) 45%, transparent);
}

/* ── Mentions légales ─────────────────────────────────────── */
.legal-section{background:var(--color-bg);padding:50px 0;border-top:1px solid var(--color-border)}
.legal-container{max-width:680px;margin:0 auto;padding:0 24px;font-size:.82rem;color:var(--color-text-muted);line-height:1.9}
.legal-container h3{font-size:1.2rem;color:var(--color-text);margin-bottom:16px}
.legal-container p{margin-bottom:6px}
.legal-container a{color:var(--color-accent)}

/* ── Bandeau RGPD ─────────────────────────────────────────── */
.rgpd-banner{
  position:fixed;bottom:18px;left:18px;right:18px;z-index:2000;
  background:var(--color-primary);color:var(--color-bg);
  border-radius:16px;padding:18px 22px;
  display:flex;align-items:center;gap:20px;flex-wrap:wrap;
  box-shadow:0 20px 60px -20px rgba(0,0,0,.4);
  max-width:640px;margin:0 auto;
}
.rgpd-content{display:flex;align-items:center;gap:20px;flex-wrap:wrap;width:100%}
.rgpd-content p{font-size:.82rem;flex:1;min-width:200px;color:color-mix(in srgb, var(--color-bg) 85%, transparent)}
.rgpd-content a{color:var(--color-accent);text-decoration:underline}
.rgpd-actions{display:flex;gap:8px;flex-shrink:0}
.btn-rgpd-accept,.btn-rgpd-refuse{
  font-family:var(--font-body);font-size:.78rem;font-weight:700;
  padding:9px 18px;border-radius:100px;border:none;cursor:pointer;
}
.btn-rgpd-accept{background:var(--color-accent);color:var(--color-primary)}
.btn-rgpd-refuse{background:transparent;color:var(--color-bg);border:1px solid color-mix(in srgb, var(--color-bg) 25%, transparent)}

/* ── Badge Créazio ────────────────────────────────────────── */
.creazio-badge{
  position:fixed;bottom:18px;right:18px;z-index:1500;
}
.creazio-badge a{
  display:flex;align-items:center;gap:6px;
  background:var(--color-bg);border:1px solid var(--color-border);
  border-radius:100px;padding:8px 14px;font-size:.72rem;font-weight:600;
  color:var(--color-text-muted);box-shadow:0 8px 24px -12px rgba(0,0,0,.2);
  transition:transform .2s, color .2s;
}
.creazio-badge a:hover{transform:translateY(-2px);color:var(--color-text)}
.creazio-badge strong{color:var(--color-accent)}

/* ── WhatsApp flottant (optionnel via composant) ────────────── */
.float-wa{
  position:fixed;bottom:18px;left:18px;z-index:1500;
  width:54px;height:54px;border-radius:50%;
  background:#25D366;display:flex;align-items:center;justify-content:center;
  font-size:1.6rem;box-shadow:0 10px 30px -10px rgba(0,0,0,.35);
  transition:transform .2s;
}
.float-wa:hover{transform:scale(1.08)}
</style>
</head>
<body>

<nav class="nav" id="site-nav">
  <div class="container nav-inner">
    <a href="#" class="nav-logo"><!-- CREAZIO:LOGO --></a>
    <button class="nav-toggle" id="nav-toggle" aria-label="Menu" onclick="document.getElementById('nav-toggle').classList.toggle('open');document.getElementById('nav-links').classList.toggle('open')">
      <span></span><span></span><span></span>
    </button>
    <ul class="nav-links" id="nav-links">
      <!-- CREAZIO:NAVLINKS -->
      <li class="nav-cta"><!-- CREAZIO:NAVCTA --></li>
    </ul>
  </div>
</nav>

<!-- CREAZIO:COMPONENTS -->

<!-- CREAZIO:LEGAL -->
<!-- CREAZIO:RGPD -->
<!-- CREAZIO:BADGE -->

<script>
// ── Nav : fond au scroll + fermeture menu mobile au clic ────
const nav = document.getElementById('site-nav');
const navLinks = document.getElementById('nav-links');
const navToggle = document.getElementById('nav-toggle');
window.addEventListener('scroll', () => {
  nav.classList.toggle('scrolled', window.scrollY > 12);
}, { passive: true });
navLinks?.querySelectorAll('a').forEach(a => a.addEventListener('click', () => {
  navLinks.classList.remove('open');
  navToggle.classList.remove('open');
}));

// ── Reveal au scroll (IntersectionObserver, léger) ──────────
const revealEls = document.querySelectorAll('.reveal');
if ('IntersectionObserver' in window) {
  const io = new IntersectionObserver((entries) => {
    entries.forEach(e => {
      if (e.isIntersecting) {
        e.target.classList.add('in');
        io.unobserve(e.target);
      }
    });
  }, { threshold: 0.12, rootMargin: '0px 0px -40px 0px' });
  revealEls.forEach(el => io.observe(el));
} else {
  revealEls.forEach(el => el.classList.add('in'));
}

// ── Parallax léger sur l'image du hero ──────────────────────
// Désactivé si prefers-reduced-motion (cf. CSS global).
const reducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
const heroBgImg = document.querySelector('.hero-bg img');
if (heroBgImg && !reducedMotion) {
  window.addEventListener('scroll', () => {
    const offset = window.scrollY * 0.15;
    heroBgImg.style.transform = `translateY(${offset}px) scale(1.08)`;
  }, { passive: true });
}

// ── Compteurs animés pour les statistiques (section "About") ──
// Anime les valeurs numériques (ex: "35+", "100%", "5h") de 0
// jusqu'à leur valeur finale quand elles entrent dans le viewport.
const statEls = document.querySelectorAll('.about-stat-val');
if (statEls.length && 'IntersectionObserver' in window && !reducedMotion) {
  const statIO = new IntersectionObserver((entries) => {
    entries.forEach(entry => {
      if (!entry.isIntersecting) return;
      const el = entry.target;
      const raw = el.textContent.trim();
      const match = raw.match(/^(\d+)(.*)$/); // ex: "35" + "+", "100" + "%"
      if (match) {
        const target = parseInt(match[1], 10);
        const suffix = match[2];
        const duration = 1200;
        const start = performance.now();
        function tick(now) {
          const progress = Math.min((now - start) / duration, 1);
          const eased = 1 - Math.pow(1 - progress, 3); // ease-out cubic
          el.textContent = Math.round(target * eased) + suffix;
          if (progress < 1) requestAnimationFrame(tick);
        }
        requestAnimationFrame(tick);
      }
      statIO.unobserve(el);
    });
  }, { threshold: 0.4 });
  statEls.forEach(el => statIO.observe(el));
}

// ── Formulaire de contact ────────────────────────────────────
const contactForm = document.getElementById('contact-form');
if (contactForm) {
  contactForm.addEventListener('submit', async (e) => {
    e.preventDefault();
    const btn = contactForm.querySelector('button[type="submit"]');
    const original = btn.textContent;
    btn.textContent = 'Envoi...';
    btn.disabled = true;
    try {
      const formData = new FormData(contactForm);
      const payload = Object.fromEntries(formData.entries());
      payload.siteId = '{{site.id}}';
      await fetch('{{site.api_url}}/api/contact', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload),
      });
      btn.textContent = 'Message envoyé ✓';
      contactForm.reset();
    } catch (err) {
      btn.textContent = 'Erreur — réessayez';
    } finally {
      setTimeout(() => { btn.textContent = original; btn.disabled = false; }, 3000);
    }
  });
}
</script>
</body>
</html>
